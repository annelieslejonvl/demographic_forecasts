#    XGBoost Configuration
# Supports both CPU and CUDA GPU training

backend: xgboost
model_type: classifier

# Device configuration
device:
  type: auto        # auto, cpu, or gpu
  gpu_id: 0      # Specific GPU index

# Preprocessing (XGBoost typically doesn't need scaling)
scaling:
  enabled: false
  type: none

# Categorical encoding (native or label is better for tree models than onehot)
categorical:
  encoding: native

dim_reduction:
  enabled: false

# Model parameters
model:
  type: classifier
  params:
    # Core params
    objective: binary:logistic
    eval_metric: [aucpr, logloss]
    enable_categorical: true
    
    # Tree structure
    max_depth: 3
    min_child_weight: 6
    gamma: 0.5
    
    # Regularization
    reg_alpha: 0.33      # L1 regularization
    reg_lambda: 0.258     # L2 regularization
    
    # Sampling
    subsample: 0.7
    colsample_bytree: 0.6
    colsample_bylevel: 0.8
    
    # Learning
    learning_rate: 0.019
    n_estimators: 900
    early_stopping_rounds: 30
    
    # Class imbalance (CRITICAL for rare events!)
    # For ~5-8% move rate → ratio ≈ 12-15
    scale_pos_weight: 15  # n_negative/n_positive (adjust based on actual data)
    max_delta_step: 1     # Helps with extreme imbalance
    
    # Reproducibility
    seed: 42
    
    # Logging
    verbose_eval: 25

# Threshold tuning
threshold_tuning:
  enabled: true
  strategy: f1  # Options: 'f1', 'youden', 'precision_recall', 'custom'
  beta: 1.0  # For F-beta score (1.0 = F1, 2.0 = F2 emphasizes recall)
  # min_precision: 0.15  # For precision_recall strategy (disabled, using f1 instead)
  # min_recall: null  # For precision_recall strategy

# Column configuration
label_col: y_moved
#features_col: features
#weight_col: null

# Evaluation configuration (prevent OOM on large datasets)
evaluation:
  sample_fraction: 0.1  # Use 10% of validation/test data for evaluation
  seed: 42
