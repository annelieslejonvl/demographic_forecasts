#    XGBoost Configuration
# Supports both CPU and CUDA GPU training

backend: xgboost
model_type: classifier

# Device configuration
device:
  type: auto        # auto, cpu, or gpu
  gpu_id: 0      # Specific GPU index

# Preprocessing (XGBoost typically doesn't need scaling)
scaling:
  enabled: false
  type: none

# Categorical encoding (native or label is better for tree models than onehot)
categorical:
  encoding: native

dim_reduction:
  enabled: false

# Model parameters
model:
  type: classifier
  params:
    # Core params
    objective: binary:logistic
    eval_metric: [logloss, auc, aucpr]
    enable_categorical: true
    
    # Tree structure
    tree_method: gpu_hist
    max_depth: 9
    min_child_weight: 2
    gamma: 0.1
    
    # Regularization
    reg_alpha: 0.1      # L1 regularization
    reg_lambda: 1.0     # L2 regularization
    
    # Sampling
    subsample: 0.8
    colsample_bytree: 0.7
    colsample_bylevel: 0.8
    
    # Learning
    learning_rate: 0.05
    n_estimators: 500
    early_stopping_rounds: 30
    
    # Class imbalance
    scale_pos_weight: 9  # Set to n_negative/n_positive for imbalanced data
    
    # Reproducibility
    seed: 42
    max_cat_to_onehot: 16      # drempel: onder dit => one-hot splits, erboven => partition splits
    max_cat_threshold: 64      # max categories per split (tegen overfitting), experimenteel
    
    # Logging
    verbose_eval: 25

# Threshold tuning
threshold_tuning:
  enabled: true
  strategy: f1  # Options: 'f1', 'youden', 'precision_recall', 'custom'
  beta: 1.0  # For F-beta score (1.0 = F1, 2.0 = F2 emphasizes recall)
  min_precision: null  # For precision_recall strategy
  min_recall: null  # For precision_recall strategy

# Column configuration
label_col: moved
features_col: features
weight_col: null
