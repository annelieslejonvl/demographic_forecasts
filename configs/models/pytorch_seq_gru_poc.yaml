# PyTorch Sequence Model - GRU Encoder (Fast POC)
# Small context and model for rapid iterations

backend: pytorch
model_type: seq_gru

device:
  type: auto
  gpu_id: null
  num_workers: 4

model:
  type: seq_gru
  params:
    encoder_type: gru
    embed_dim: 32
    max_seq_len: 64
    pos_weight_max_samples: 20000

    # GRU encoder
    encoder:
      hidden_dim: 64
      num_layers: 1
      dropout: 0.2

    # Prediction head
    head_hidden_dims: [64]
    dropout: 0.2

    # Training
    learning_rate: 0.001
    weight_decay: 0.0001
    epochs: 5
    batch_size: 256
    early_stopping_patience: 3
    early_stopping_metric: composite  # composite|val_loss|val_mean_auc|val_mean_ap|val_mean_f1
    use_amp: true

# Events to predict
events:
  - y_moved
  - birth1_event
  - birth2_event
  - divorce_event
  - getalifeother_event

# Prediction horizons (years)
horizons: [1, 3, 5]
