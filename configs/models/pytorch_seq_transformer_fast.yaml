# PyTorch Sequence Model - Transformer Fast (Minimal)
# Small but properly proportioned: embed_dim=64, 2 heads, 2 layers
# ~4x smaller than standard config, suitable for quick iteration

backend: pytorch
model_type: seq_transformer

device:
  type: auto
  gpu_id: null

model:
  type: seq_transformer
  params:
    horizon_weights: [3.0, 1.5, 1.0]
    balanced_sampling: false
    calibration_method: isotonic
    mc_dropout_samples: 0              # disabled for speed
    swa_start_fraction: null
    loss_type: aft
    multi_head: true
    event_weight_mode: learned
    encoder_type: transformer
    embed_dim: 64
    max_seq_len: 64
    pos_weight_max_samples: 5000

    # Minimal Transformer encoder
    # embed_dim=64 must be divisible by num_heads=2 -> head_dim=32
    encoder:
      num_heads: 2
      num_layers: 2
      ff_dim: 256              # 4x embed_dim (standard ratio)
      dropout: 0.1

    # Prediction head (64 -> 32 -> 2)
    head_hidden_dims: [64, 32]
    dropout: 0.2

    # Training (lower LR for transformer stability)
    learning_rate: 0.0005
    weight_decay: 0.001
    epochs: 30
    batch_size: 256
    early_stopping_patience: 5
    early_stopping_metric: composite
    use_amp: true

    # LR Finder
    lr_find: true
    lr_find_config:
      lr_min: 1.0e-7
      lr_max: 0.1              # lower max for transformer stability
      num_steps: 2500
      fraction: 0.3

# Events to predict
events:
  - y_moved
  - birth1_event
  - birth2_event
  - divorce_event
  - getalifeother_event

# Prediction horizons (years)
horizons: [1, 3, 5]
