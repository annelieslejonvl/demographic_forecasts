# PyTorch Logistic Regression Configuration
# Supports both CPU and CUDA GPU training
# Simple linear model (single layer, no hidden layers)

backend: pytorch
model_type: logistic_regression

# Device configuration
device:
  type: auto
  gpu_id: null
  num_workers: 4
  memory_fraction: 0.9

# Preprocessing
scaling:
  enabled: true
  type: standard

# Categorical encoding (label is more memory efficient than onehot)
categorical:
  encoding: label

dim_reduction:
  enabled: false
  k: 50

# Model parameters
model:
  type: logistic_regression
  params:
    learning_rate: 0.01
    weight_decay: 0.01
    epochs: 10
    batch_size: 2048
    early_stopping_patience: 15
    use_amp: true
    incremental_chunk_size: 1000000

# Threshold tuning
threshold_tuning:
  enabled: true
  strategy: f1
  beta: 1.0

# Column configuration
label_col: y_moved
