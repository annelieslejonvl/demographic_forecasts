# PyTorch Sequence Model - GRU Encoder
# LLM-style approach: tokenized life-event sequences -> bidirectional GRU

backend: pytorch
model_type: seq_gru

device:
  type: auto
  gpu_id: null

model:
  type: seq_gru
  params:
    encoder_type: gru
    embed_dim: 64
    max_seq_len: 96           # ~8 years of history (10-12 tokens/yr)

    # GRU encoder
    encoder:
      hidden_dim: 256
      num_layers: 2
      dropout: 0.3

    # Prediction head
    head_hidden_dims: [128, 64]
    dropout: 0.2

    # Training
    learning_rate: 0.001
    weight_decay: 0.0001
    epochs: 50
    batch_size: 64
    early_stopping_patience: 10
    early_stopping_metric: composite  # composite|val_loss|val_mean_auc|val_mean_ap|val_mean_f1
    use_amp: true

    # LR Finder - set to true to auto-find learning rate before training
    lr_find: false
    lr_find_config:
      lr_min: 1.0e-7
      lr_max: 1.0
      num_steps: 200
      fraction: 0.1

# Events to predict
events:
  - y_moved
  - birth1_event
  - birth2_event
  - divorce_event
  - getalifeother_event

# Prediction horizons (years)
horizons: [1, 3, 5]
