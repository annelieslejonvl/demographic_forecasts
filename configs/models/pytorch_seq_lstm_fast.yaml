# PyTorch Sequence Model - LSTM Fast POC
# Minimal config for quick iteration (<10 min on 10% data)

backend: pytorch
model_type: seq_lstm

device:
  type: auto
  gpu_id: null

model:
  type: seq_lstm
  params:
    encoder_type: lstm
    embed_dim: 16
    max_seq_len: 64
    pos_weight_max_samples: 5000

    # Small LSTM encoder
    encoder:
      hidden_dim: 64
      num_layers: 1
      dropout: 0.1

    # Prediction head
    head_hidden_dims: [32]
    dropout: 0.1

    # Training - aggressive early stopping
    learning_rate: 0.003
    weight_decay: 0.0001
    epochs: 15
    batch_size: 512
    early_stopping_patience: 3
    early_stopping_metric: composite  # composite|val_loss|val_mean_auc|val_mean_ap|val_mean_f1
    use_amp: true

# Events to predict
events:
  - y_moved
  - birth1_event
  - birth2_event
  - divorce_event
  - getalifeother_event

# Prediction horizons (years)
horizons: [1, 3, 5]
