# XGBoost Survival Analysis Configuration
# Supports AFT (Accelerated Failure Time) and Cox PH objectives
# GPU-accelerated training via CUDA

backend: xgboost
model_type: survival

# Device configuration
device:
  type: auto        # auto, cpu, or gpu
  gpu_id: 0

# Model configuration
model:
  type: aft  # 'aft' or 'cox'
  params:
    # AFT-specific parameters
    objective: survival:aft
    eval_metric: aft-nloglik
    aft_loss_distribution: normal    # normal, logistic, or extreme
    aft_loss_distribution_scale: 1.0

    # Tree structure
    max_depth: 5
    min_child_weight: 10
    gamma: 0.5

    # Regularization
    reg_alpha: 0.2
    reg_lambda: 3.0

    # Sampling
    subsample: 0.7
    colsample_bytree: 0.6
    colsample_bylevel: 0.8

    # Learning
    learning_rate: 0.05
    n_estimators: 500
    early_stopping_rounds: 30

    # Performance
    tree_method: hist
    device: cuda

    # Reproducibility
    seed: 42

    # Logging
    verbose_eval: 25

# Prediction horizons (years)
horizons: [1, 3, 5]

# Events to model (one survival model per event)
events:
  - y_moved
  - birth1_event
  - birth2_event
  - divorce_event
  - getalifeother_event

# Evaluation configuration
evaluation:
  sample_fraction: 0.1
  seed: 42
