key_cols: [sid, year]    # of jouw unieke sleutel
split:
  year_col: year
  train_range: [2018, 2022]
  valid_range: [2023, 2024]
  test_range:  [2025, 2025]

tune:
  sampling:
    type: neg_frac
    neg_frac: 0.2
    seed: 1
  hard_negatives:
    enabled: false

final:
  sampling:
    type: none
  hard_negatives:
    enabled: true
    hard_per_pos: 10
    q: 0.001
    seed: 1

weights:
  enabled: true
  method: inverse_prevalence   # pos_weight = n_neg/n_pos
  col: weight

